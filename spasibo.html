<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1B63E8;--blue-lt:#4A90E8;--text:#EDF2FF;--muted:#7A96BB}
html,body{height:100%}
body{
  background:radial-gradient(ellipse 100% 70% at 50% 0%,#0D1C38 0%,#06101D 65%);
  color:var(--text);font-family:'Montserrat',sans-serif;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(74,144,232,0.09) 1px,transparent 1px);
  background-size:38px 38px;pointer-events:none;z-index:0;
}
#canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
.orbs{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px)}
.orb1{width:700px;height:700px;left:-250px;top:0;background:rgba(27,99,232,0.2);animation:orbF 22s ease-in-out infinite}
.orb2{width:500px;height:500px;right:-120px;top:-80px;background:rgba(74,144,232,0.12);animation:orbF 16s ease-in-out infinite reverse}
@keyframes orbF{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
.scan{position:fixed;left:0;right:0;height:1px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(74,144,232,0.4),rgba(147,197,253,0.6),transparent);
  animation:scanMove 8s linear infinite}
@keyframes scanMove{from{top:-2px}to{top:100vh}}

.wrap{
  position:relative;z-index:2;
  text-align:center;
  padding:40px 24px;
  max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:24px;
}

.logo{font-size:21px;font-weight:900;letter-spacing:.13em;text-decoration:none;margin-bottom:8px;animation:fadeDown .6s both}
.logo .a{color:#fff}.logo .pt{color:var(--blue-lt)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

.ok-circle{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),#60A5FA);
  box-shadow:0 0 60px rgba(27,99,232,0.6);
  display:flex;align-items:center;justify-content:center;
  animation:popIn .6s cubic-bezier(.34,1.56,.64,1) .2s both;
}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

h1{
  font-size:clamp(28px,5vw,40px);font-weight:900;
  letter-spacing:-.02em;line-height:1.1;
  animation:fadeUp .7s .4s both;
}
.sub{
  font-size:16px;color:var(--muted);line-height:1.7;
  max-width:380px;
  animation:fadeUp .7s .55s both;
}
.card{
  background:#0C1929;
  border:1px solid rgba(74,144,232,0.2);
  border-radius:20px;padding:28px 32px;
  width:100%;
  position:relative;overflow:hidden;
  animation:fadeUp .7s .65s both;
  box-shadow:0 24px 60px rgba(0,0,0,0.5),0 0 60px rgba(27,99,232,0.08);
}
.card::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(74,144,232,0.8),transparent);
  animation:shimmer 3.5s linear infinite;
}
@keyframes shimmer{to{left:100%}}
.steps{display:flex;flex-direction:column;gap:14px;text-align:left}
.step{display:flex;align-items:center;gap:14px}
.step-num{
  width:32px;height:32px;flex-shrink:0;
  border-radius:50%;background:rgba(27,99,232,0.15);
  border:1px solid rgba(74,144,232,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--blue-lt);
}
.step-text{font-size:14px;color:var(--muted);line-height:1.5}
.step-text strong{color:var(--text);font-weight:600}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>
<div class="scan" aria-hidden="true"></div>
<canvas id="canvas" aria-hidden="true"></canvas>

<div class="wrap">
  <a href="/" class="logo"><span class="a">A</span><span class="pt">POINT</span></a>

  <div class="ok-circle">
    <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
      <path d="M8 19l8 8.5L30 10.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Rahmat, ariza<br>qabul qilindi!</h1>

  <p class="sub">Mutaxassisimiz tez orada siz bilan bog'lanadi va APOINT tizimini shaxsan ko'rsatadi.</p>

  <div class="card">
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text"><strong>30 daqiqa ichida</strong> — menejer siz bilan bog'lanadi</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text"><strong>Menejer bog'lanadi</strong> — barcha savollarga javob beradi</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text"><strong>Savollarga javob</strong> — narx, integratsiya va joriy etish muddatlari</div>
      </div>
    </div>
  </div>
</div>

<script>
// Particles
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let W,H,pts=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',()=>{resize();init()});
function init(){pts=[];for(let i=0;i<50;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5,a:Math.random()*.5+.1})}
init();
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of pts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(74,144,232,${p.a})`;ctx.fill();
  }
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<120){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(74,144,232,${(1-d/120)*.15})`;ctx.lineWidth=.6;ctx.stroke()}
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
